[experiment]
name = "anomaly_ms_cnn_bilstm_attention_autoencoder_w100"
seed = 42
output_dir = "runs/anomaly_ms_cnn_bilstm_attention_autoencoder_w100"

[data]
dataset = "swat"
task = "binary_anomaly_detection"
protocol = "standard_normal_attack"
normal_path = "data/raw/SWaT_Dataset_Normal_v1.csv"
attack_path = "data/raw/SWaT_Dataset_Attack_v0.csv"
attack_list_path = "data/raw/List_of_attacks_Final.xlsx"
validation_size = 0.15
test_size = 0.20
window_size = 100
window_stride = 50
window_label_rule = "any_attack"
label_column = "Normal/Attack"
timestamp_column = "Timestamp"
drop_timestamp = true
scale_method = "standard"
processed_output_dir = "data/processed"
apply_smote = false

[model]
name = "ms_cnn_bilstm_attention_autoencoder"
conv_channels = 64
kernel_sizes = [3, 5, 7]
lstm_hidden = 128
lstm_layers = 1
attention_heads = 4
dense_hidden = 64
dropout = 0.20

[training]
epochs = 50
batch_size = 128
learning_rate = 0.001
weight_decay = 0.00005
loss = "reconstruction_mse"
early_stopping_patience = 8
anomaly_threshold_percentile = 99.5
