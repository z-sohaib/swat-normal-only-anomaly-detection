[experiment]
name = "anomaly_cnn_transformer_forecast_stable_features"
seed = 42
output_dir = "runs/anomaly_cnn_transformer_forecast_stable_features"

[data]
dataset = "swat"
task = "binary_anomaly_detection"
protocol = "standard_normal_attack"
normal_path = "data/raw/SWaT_Dataset_Normal_v1.csv"
attack_path = "data/raw/SWaT_Dataset_Attack_v0.csv"
attack_list_path = "data/raw/List_of_attacks_Final.xlsx"
validation_size = 0.15
test_size = 0.20
window_size = 100
window_stride = 50
window_label_rule = "any_attack"
label_column = "Normal/Attack"
timestamp_column = "Timestamp"
drop_timestamp = true
drop_columns = ["AIT201", "P201", "FIT601", "P601", "P602", "P603"]
scale_method = "standard"
processed_output_dir = "data/processed"
apply_smote = false

[model]
name = "cnn_transformer_autoencoder"
conv_channels = 32
kernel_sizes = [3, 5, 7]
lstm_hidden = 128
lstm_layers = 2
attention_heads = 4
dense_hidden = 256
dropout = 0.10

[training]
epochs = 50
batch_size = 128
learning_rate = 0.0005
weight_decay = 0.0001
loss = "forecast_mse"
early_stopping_patience = 8
anomaly_score_method = "top5_robust_z"
anomaly_calibration_source = "normal_validation"
anomaly_threshold_percentile = 99.0
anomaly_min_consecutive_windows = 3
anomaly_merge_gap_windows = 5
